# ms_probe.yml v1 -- read-only feasibility test: can a GitHub Actions browser load MarketScreener?
# Save as .github/workflows/ms_probe.yml; ms_probe.py goes in the repository root. No secrets needed.
name: MS Probe

"on":
  workflow_dispatch:
    inputs:
      abbrev_ms:
        description: 'MarketScreener abbreviation(s), comma separated (e.g. "TELE2-AB-13247047,APPLOVIN-CORP-...")'
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the probe
        env:
          ABBREV_MS: ${{ inputs.abbrev_ms }}
        run: python ms_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-probe-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
