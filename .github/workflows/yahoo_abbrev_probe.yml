# yahoo_abbrev_probe.yml v2 (longer timeout: the probe now waits 12 s between queries and retries after Yahoo 500s)
# yahoo_abbrev_probe.yml v1 -- read-only feasibility test: can Yahoo Search find the SW / AS / MS / GF
# abbreviations from a GitHub Actions runner? Save as .github/workflows/yahoo_abbrev_probe.yml;
# yahoo_abbrev_probe.py goes in the repository root. No secrets needed. Reuses requirements.txt (seleniumbase, requests).
name: Yahoo Abbrev Probe

"on":
  workflow_dispatch:
    inputs:
      queries:
        description: 'One stock per line: Company name | Ticker | country  (e.g. "Meta Platforms Inc | META | us")'
        required: true
        default: |
          Meta Platforms Inc | META | us
          flatexDEGIRO AG | FTK | de
          Chemometec A/S | CHEMM | dk
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the probe
        env:
          QUERIES: ${{ inputs.queries }}
        run: python yahoo_abbrev_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-abbrev-probe-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
