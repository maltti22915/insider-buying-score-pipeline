# ============================================================================
# insider_score_scraper.yml
# ============================================================================
# Runs insider_score_scraper.py for exactly ONE company at a time, triggered
# on demand via GitHub's own workflow_dispatch API -- called directly from
# this project's own Google Apps Script row-refresh pipeline (fn_24_05)
# whenever the user refreshes a specific row.
#
# VERSION 3 (REQUESTED DIRECTLY, REAL CONFIRMED BUG): a new "sheet_name"
# input added. A real production run showed the receiving webhook
# (fn_90_01) refusing a genuinely correct write, reporting a completely
# unrelated company for a row that in truth only ever held the expected
# one. Root cause, confirmed directly: this workflow never had any concept
# of which real sheet (e.g. "Watch", not just "Salkku") a given row-refresh
# actually came from -- insider_score_scraper.py's own v2 had SHEET_NAME
# hardcoded to 'Salkku' regardless, so the webhook's own mismatch check was
# comparing against the wrong sheet's own row entirely whenever a refresh
# came from any other sheet. Apps Script's own fn_24_71 (VERSION 2 there)
# now passes the row's own real sheet name as this new input, and
# insider_score_scraper.py's own v3 reads it as a real environment
# variable instead of a hardcoded constant.
#
# VERSION 2 (REQUESTED DIRECTLY, ARCHITECTURE CHANGE): the original v1 of
# this workflow ran on a fixed daily schedule (cron), scraping every
# configured company in one run. Replaced entirely -- the actual intent was
# always an on-demand, single-row trigger, not an independent daily bulk
# job. The schedule trigger has been removed; workflow_dispatch now
# requires row_number/abbrev_is as real inputs, matching what
# insider_score_scraper.py's own v2 now expects as environment variables.
#
# Save this file as .github/workflows/insider_score_scraper.yml in the
# repository.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   GAS_WEBHOOK_URL  -- the deployed
#                       fn_90_01_InsiderScoreWebhook_StockData_60 Web App URL
#
# (GOOGLE_SERVICE_ACCOUNT_JSON and SPREADSHEET_ID, required by v1, are no
# longer needed at all -- this version never reads the spreadsheet itself.)
# ============================================================================

name: Insider Buying Score Scraper

"on":
  workflow_dispatch:
    inputs:
      row_number:
        description: 'The specific row on the target sheet this run is for'
        required: true
        type: string
      abbrev_is:
        description: "That row's own current InsiderScreener company slug"
        required: true
        type: string
      sheet_name:
        description: 'The real sheet this row lives on (e.g. "Salkku", "Watch")'
        required: true
        type: string

jobs:
  scrape-insider-score:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the scraper
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          ROW_NUMBER: ${{ inputs.row_number }}
          ABBREV_IS: ${{ inputs.abbrev_is }}
          SHEET_NAME: ${{ inputs.sheet_name }}
        run: python insider_score_scraper.py
