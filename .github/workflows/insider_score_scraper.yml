insider_score_scraper.yml  v5 -> v6
====================================

1) Add this paragraph in the header comment, above "VERSION 5":

# VERSION 6 (REQUESTED DIRECTLY, SPEED + DIAGNOSTICS): (1) pip packages are
# now cached between runs (setup-python's own cache: 'pip'), so seleniumbase
# and its dependencies are no longer downloaded and installed from scratch
# on every single run. (2) The ./diagnostics folder that
# insider_score_scraper.py v6+ writes (AlphaSpread screenshot + HTML when
# the AS scrape or webhook write fails) is now uploaded as a run artifact;
# v5 had no such step, so those files were discarded when the runner was
# torn down. (3) timeout-minutes: 10, so a hung browser can never hold a
# runner for GitHub's default six hours.


2) Replace everything from the line `jobs:` to the end of the file with:

jobs:
  scrape-insider-score:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the scraper
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          ROW_NUMBER: ${{ inputs.row_number }}
          ABBREV_IS: ${{ inputs.abbrev_is }}
          SHEET_NAME: ${{ inputs.sheet_name }}
          ABBREV_AS: ${{ inputs.abbrev_as }}
        run: python insider_score_scraper.py

      - name: Upload AS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: as-diagnostics-row${{ inputs.row_number }}-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3


NOTES
-----
- The cache needs requirements.txt to exist in the repo root (it already does,
  since the install step reads it). The first run after this change still
  installs everything and fills the cache; later runs reuse it.
- The artifact only exists for runs where diagnostics were written, so you
  will see one on failures such as the Alibaba VALUE_NULL run and none on
  clean runs (if-no-files-found: ignore).
- To see where the time goes, open one run in the Actions tab: each step
  shows its own duration. Compare "Install dependencies" before and after.
