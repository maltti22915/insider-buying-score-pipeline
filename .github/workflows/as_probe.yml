# as_probe.yml v1 -- manual test: read AlphaSpread ratio pages from a GitHub runner
name: AS Probe
on:
  workflow_dispatch:
    inputs:
      as_path:
        description: "AlphaSpread exchange/ticker, e.g. nyse/baba"
        default: "nyse/baba"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install curl_cffi seleniumbase && sudo apt-get install -y xvfb
      - run: xvfb-run -a python as_probe.py
        env: { AS_PATH: "${{ inputs.as_path }}" }
