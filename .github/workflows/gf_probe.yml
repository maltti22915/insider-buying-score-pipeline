# gf_probe.yml v2 -- manual test: do other GitHub runner types get GuruFocus past Cloudflare?
name: GF Probe
on:
  workflow_dispatch:
    inputs:
      abbrev_gf:
        description: "GuruFocus ticker path, e.g. NOW"
        default: "NOW"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Show the runner's public IP
        run: curl -s https://ipinfo.io/json | head -20 || true
      - run: pip install curl_cffi seleniumbase
      - name: Probe (Linux needs a virtual display)
        env: { ABBREV_GF: "${{ inputs.abbrev_gf }}", PROBE_LABEL: "${{ matrix.os }}" }
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y xvfb >/dev/null; xvfb-run -a python gf_probe.py; else python gf_probe.py; fi
