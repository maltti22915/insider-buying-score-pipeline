# as_quality_probe.yml v2 -- manual test of the six structural quality metrics for one ticker
name: AS Quality Probe
on:
  workflow_dispatch:
    inputs:
      as_path:
        description: "AlphaSpread exchange/ticker, e.g. nyse/baba"
        default: "nyse/baba"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install seleniumbase && sudo apt-get install -y xvfb
      - name: Unit test (runs only if the test file exists in the repo)
        if: hashFiles('extractor_tests/test_as_quality_metrics.py') != ''
        run: python extractor_tests/test_as_quality_metrics.py
      - run: xvfb-run -a python as_quality_probe.py
        env: { AS_PATH: "${{ inputs.as_path }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: as_pages
          path: as_pages/
