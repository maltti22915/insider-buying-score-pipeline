# abbrev_search.yml v1 -- Yahoo Search for Task 20 (stock abbreviations); replaces Scrape.do.
# Save as .github/workflows/abbrev_search.yml; abbrev_search.py and gh_log_uploader.py go in the repository root.
# Started by Apps Script (fn_20_21) with workflow_dispatch. Secret needed: GAS_WEBHOOK_URL (already exists).
name: Abbrev Search

"on":
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Request id made by Apps Script (answer is stored under ABBRS_<id>)'
        required: true
        type: string
      queries:
        description: 'JSON list of {id, query, site}'
        required: true
        type: string
      country:
        description: 'Country code (information only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the Yahoo searches
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          QUERIES: ${{ inputs.queries }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: python abbrev_search.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abbrev-search-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
