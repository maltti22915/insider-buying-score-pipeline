# sw_probe.yml v1 -- read-only experiment: which browser behaviour passes the Simply Wall St Cloudflare challenge most often?
# Save as .github/workflows/sw_probe.yml; sw_probe.py goes in the repository root. No secrets needed. Posts nothing to the sheet.
# 8 attempts x 5 variants takes roughly 25-35 minutes. Result: the job summary page (table) and the log lines "SW_PROBE ...".
name: SW Probe

"on":
  workflow_dispatch:
    inputs:
      abbrev_sw:
        description: 'SW abbreviation, e.g. us/software/nasdaq-adsk/autodesk'
        required: true
        type: string
      attempts_per_variant:
        description: 'Attempts per variant (default 8)'
        required: false
        default: '8'
        type: string
      variants:
        description: 'Variants to test, comma separated (A baseline, B early_click, C long_reconnect, D warmup_home, E no_click)'
        required: false
        default: 'A,B,C,D,E'
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the probe
        env:
          ABBREV_SW: ${{ inputs.abbrev_sw }}
          ATTEMPTS_PER_VARIANT: ${{ inputs.attempts_per_variant }}
          VARIANTS: ${{ inputs.variants }}
        run: python sw_probe.py
